
[tox]
min_version = 4.0
env_list =
    backend-numpy
    backend-tensorflow
    backend-torch
    backend-jax

[testenv]
base_python = python3.11
package = editable
extras =
    dev
    sklearn
    numpy
commands =
    python -m pytest -q tests/ --tb=short -ra {posargs}

[testenv:backend-numpy]
extras =
    {[testenv]extras}
    numpy
set_env =
    KERAS_BACKEND = numpy

[testenv:backend-tensorflow]
extras =
    {[testenv]extras}
    tensorflow
set_env =
    KERAS_BACKEND = tensorflow

[testenv:backend-torch]
extras =
    {[testenv]extras}
    torch
set_env =
    KERAS_BACKEND = torch

[testenv:backend-jax]
extras =
    {[testenv]extras}
    jax
set_env =
    KERAS_BACKEND = jax
