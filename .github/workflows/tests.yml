
name: Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  backend-tests:
    name: Python 3.11 / ${{ matrix.backend }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        backend:
          - numpy
          - tensorflow
          - torch
          - jax

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install tox
        run: python -m pip install "tox>=4"

      - name: Run tests
        run: tox -e backend-${{ matrix.backend }}
